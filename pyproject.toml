# pyproject.toml -- Ensembl Genes Metadata project configuration

## Generic configuration
[project]
name = "ensembl-genes-metadata"
version = "0.1.0"
requires-python = ">= 3.10"
description = "Ensembl Genes Metadata -- tools and pipelines to manage assembly and gene metadata"
readme = "README.md"
authors = [
    {name = "Ensembl", email = "dev@ensembl.org"},
]
license = "Apache-2.0"
keywords = [
    "ensembl",
    "bioinformatics",
    "assembly",
    "metadata",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests >= 2.28.0",
    "pymysql >= 1.0.0",
    "tenacity >= 8.0.0",
]

[project.optional-dependencies]
cicd = [
    "black >= 23.11.0",
    "coverage >= 7.3.2",
    "mypy >= 1.2.0",
    "pylint >= 3.0.2",
    "pytest >= 7.4.3",
    "types-requests",
]

[project.urls]
homepage = "https://www.ensembl.org"
repository = "https://github.com/Ensembl/ensembl-genes-metadata"

[tool.setuptools]
package-dir = {"" = "src/python"}

[tool.setuptools.packages.find]
where = ["src/python"]

[build-system]
requires = [
    "setuptools",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 110
target-version = ["py310"]

[tool.pylint.main]
max-line-length = 110
disable = [
    "invalid-name",
    "logging-fstring-interpolation",
    "similarities",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-locals",
    "too-many-statements",
    "unspecified-encoding",
    "wildcard-import",
]
max-attributes = 12
max-branches = 15

[tool.mypy]
mypy_path = "src/python"
disallow_untyped_defs = true
explicit_package_bases = true
ignore_missing_imports = true
show_error_codes = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--tb=native",
]
testpaths = ["tests"]
norecursedirs = ["data", "docs", "*.egg_info"]

[tool.coverage.run]
branch = true
source = [
    "ensembl.genes",
]

[tool.coverage.report]
exclude_lines = [
    "def __repr__",
    "if self\\.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "if TYPE_CHECKING:",
]
