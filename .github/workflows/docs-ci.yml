name: Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'docs_mkdocs/**'
      - 'mkdocs.yml'
      - 'src/python/**'
      - 'pipelines/**/*.nf'
      - 'pipelines/**/nextflow_schema.json'
      - 'README.md'
  pull_request:
    paths:
      - 'docs/**'
      - 'docs_mkdocs/**'
      - 'mkdocs.yml'
      - 'src/python/**'
      - 'pipelines/**/*.nf'
      - 'pipelines/**/nextflow_schema.json'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[docs]" || \
          pip install sphinx sphinx-autoapi sphinx-rtd-theme myst-parser \
          mkdocs-material mkdocs-minify-plugin zensical

      - name: Generate Sphinx API Parameter Reference
        run: python -m docs.generate_docs

      - name: Generate MkDocs Pipeline Docs
        run: python -m docs.generate_mkdocs

      - name: Sphinx Build
        run: sphinx-build --keep-going -b html docs/source docs/build/html

      - name: Sphinx Link Check
        if: ${{ github.event_name != 'pull_request' }}
        continue-on-error: true
        run: sphinx-build -b linkcheck docs/source docs/build/linkcheck

      - name: MkDocs Build
        run: zensical build --config-file mkdocs.yml --strict

      # MkDocs owns the site root (matches ensembl-genes-nf's look); the
      # Sphinx build (with the gb_metadata autoapi reference) is nested
      # under /api/ so both are reachable from one Pages deployment.
      - name: Combine Sites
        run: |
          mkdir -p site/api
          cp -r docs/build/html/. site/api/

      - name: Setup Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
